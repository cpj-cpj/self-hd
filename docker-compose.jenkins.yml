services:
  jenkins:
    build:
      context: ./jenkins
    image: self-hd-jenkins:lts-docker
    container_name: self-hd-jenkins
    user: root
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD before starting Jenkins}
    ports:
      - "8090:8080"
      - "50001:50000"
    volumes:
      - self-hd-jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  self-hd-jenkins-home:
